# Baut die Debug-APK, signiert sie mit dem festen diktat-Schlüssel und legt sie auf den Zweig `apk`
# (fester Link in der README, Quelle des Update-Buttons in der App). Ersetzt das Veröffentlichen von Hand,
# damit die Signatur nicht mehr an einem einzelnen Rechner hängt.
#
# Der Schlüssel liegt verschlüsselt (AES-256, PBKDF2) als `debug.keystore.enc` auf dem Zweig `signing`.
# Das Passwort dazu steht nur im Repository-Secret DIKTAT_SIGNING_PASSWORD. Gibt es noch keinen
# Schlüssel, legt der erste Lauf ihn an und sichert ihn dort; jeder spätere Lauf nimmt genau diesen.
name: APK

on:
  push:
    branches: [diktat-edition, "ccr-*"]
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:

concurrency:
  group: apk
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SIGNING_PASSWORD: ${{ secrets.DIKTAT_SIGNING_PASSWORD }}
    steps:
      - name: Secret prüfen
        run: |
          if [ -z "$SIGNING_PASSWORD" ]; then
            echo "::error::Das Secret DIKTAT_SIGNING_PASSWORD fehlt (Settings › Secrets and variables › Actions)."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Android-SDK ergänzen
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: sherpa-onnx holen
        run: bash tools/fetch-sherpa-onnx.sh

      - name: Signaturschlüssel bereitstellen
        id: key
        run: |
          mkdir -p ~/.android
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          decrypt() { openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -pass env:SIGNING_PASSWORD -in "$1" -out ~/.android/debug.keystore; }
          if git fetch -q origin signing 2>/dev/null; then
            git show origin/signing:debug.keystore.enc > "$RUNNER_TEMP/key.enc"
            decrypt "$RUNNER_TEMP/key.enc" || { echo "::error::Schlüssel lässt sich nicht entschlüsseln: stimmt DIKTAT_SIGNING_PASSWORD?"; exit 1; }
            echo "new=0" >> "$GITHUB_OUTPUT"
          else
            # Erster Lauf: neuer Schlüssel in der Form des Android-Debug-Schlüssels, damit publish-apk.sh unverändert bleibt.
            keytool -genkeypair -v -keystore ~/.android/debug.keystore -storetype PKCS12 \
              -alias androiddebugkey -storepass android -keypass android \
              -keyalg RSA -keysize 2048 -validity 10950 -dname "CN=Android Debug,O=Android,C=US" > /dev/null
            openssl enc -aes-256-cbc -pbkdf2 -iter 600000 -salt -pass env:SIGNING_PASSWORD \
              -in ~/.android/debug.keystore -out "$RUNNER_TEMP/debug.keystore.enc"
            work="$RUNNER_TEMP/signing"
            git worktree add -q --detach "$work"
            git -C "$work" checkout -q --orphan signing
            git -C "$work" rm -rq --cached . > /dev/null
            find "$work" -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
            cp "$RUNNER_TEMP/debug.keystore.enc" "$work/debug.keystore.enc"
            printf '%s\n' "# Signaturschlüssel von diktat" "" \
              "Verschlüsselt mit AES-256 (PBKDF2, 600000 Runden). Das Passwort steht nur im Secret DIKTAT_SIGNING_PASSWORD." \
              "Der Workflow .github/workflows/apk.yml entschlüsselt ihn zum Signieren. Diesen Zweig nicht löschen:" \
              "ohne den Schlüssel lässt sich die installierte App nicht mehr aktualisieren." > "$work/README.md"
            git -C "$work" add debug.keystore.enc README.md
            git -C "$work" commit -q -m "Signaturschlüssel (verschlüsselt)"
            git -C "$work" push -q origin signing
            echo "new=1" >> "$GITHUB_OUTPUT"
          fi
          keytool -list -v -keystore ~/.android/debug.keystore -storepass android | grep -m1 "SHA256:" | sed 's/^/Fingerabdruck: /'

      - name: APK bauen und veröffentlichen
        env:
          # Nur beim allerersten Lauf: der neue Schlüssel ersetzt bewusst den verlorenen alten.
          ALLOW_NEW_KEY: ${{ steps.key.outputs.new }}
        run: bash scripts/publish-apk.sh | tee "$RUNNER_TEMP/publish.log"

      - name: Zusammenfassung
        if: always()
        run: |
          { echo "### APK"; grep -h "Fertig:" "$RUNNER_TEMP/publish.log" 2>/dev/null || echo "Nicht veröffentlicht."; } >> "$GITHUB_STEP_SUMMARY"
          rm -f ~/.android/debug.keystore
